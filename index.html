<!DOCTYPE html>
<html lang='id'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0, user-scalable=yes'>
  <title>Exam-Generator Pro | Manual + AI + Gambar</title>
  <link href='https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap' rel='stylesheet'>
  <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css'>
  <script src='https://cdn.jsdelivr.net/npm/sweetalert2@11'></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background: #e8f3e8; display: flex; height: 100vh; overflow: hidden; }
    .sidebar { width: 260px; background: #0b3b2f; color: white; padding: 24px 16px; overflow-y: auto; }
    .sidebar .logo { font-size: 1.5rem; font-weight: bold; margin-bottom: 32px; }
    .nav-item { padding: 12px 16px; margin: 4px 0; border-radius: 16px; cursor: pointer; display: flex; gap: 12px; align-items: center; }
    .nav-item.active, .nav-item:hover { background: #1e6f5c; }
    .main-panel { flex: 1; overflow-y: auto; padding: 24px; background: #f0faf0; }
    .card { background: white; border-radius: 28px; padding: 24px; margin-bottom: 24px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
    .btn { padding: 10px 20px; border-radius: 40px; border: none; font-weight: 600; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
    .btn-primary { background: #2e7d32; color: white; }
    .btn-warning { background: #f9a825; color: #1e2a1e; }
    .btn-danger { background: #d32f2f; color: white; }
    .btn-outline { background: transparent; border: 1px solid #2e7d32; color: #2e7d32; }
    input, select, textarea { width: 100%; padding: 10px 14px; border-radius: 24px; border: 1px solid #ccc; margin: 6px 0 12px; }
    .flex-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .grid-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .soal-item { border-left: 4px solid #2e7d32; padding: 12px 16px; margin: 12px 0; background: #f9fff9; border-radius: 16px; }
    .soal-editor { background: #fff8e7; border-radius: 24px; padding: 18px; border-left: 8px solid #2e7d32; font-family: monospace; white-space: pre-wrap; max-height: 320px; overflow: auto; }
    .subsoal-form { background: #f5f5f5; padding: 16px; border-radius: 16px; margin: 12px 0; }
    .gambar-preview { max-width: 100px; max-height: 80px; margin-top: 8px; border-radius: 8px; }
    .option-with-img { display: flex; align-items: center; gap: 12px; margin: 8px 0; }
    @media (max-width: 700px) { .sidebar { width: 70px; } .sidebar span { display: none; } .grid-2col { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div class="sidebar">
  <div class="logo"><i class="fas fa-brain"></i> <span>ExamForge</span></div>
  <div class="nav-item active" data-menu="manual"><i class="fas fa-pen-alt"></i> <span>Buat Soal Manual</span></div>
  <div class="nav-item" data-menu="ai-generate"><i class="fas fa-robot"></i> <span>AI Generate</span></div>
  <div class="nav-item" data-menu="bank"><i class="fas fa-database"></i> <span>Bank Soal</span></div>
  <div class="nav-item" data-menu="maker"><i class="fas fa-edit"></i> <span>Test Maker</span></div>
  <div class="nav-item" data-menu="cbt"><i class="fas fa-laptop"></i> <span>CBT</span></div>
  <div class="nav-item" data-menu="settings"><i class="fas fa-cog"></i> <span>Settings</span></div>
</div>
<div class="main-panel" id="mainPanel"></div>

<script>
  // ========== STATE ==========
  let bankSoal = JSON.parse(localStorage.getItem('bankSoalFull') || `{
    "Matematika": [],
    "IPA": [],
    "Bahasa Inggris": []
  }`);
  let currentMapel = "Matematika";
  let examSettings = JSON.parse(localStorage.getItem('examSettingsCplx') || '{}');
  let apiKeys = JSON.parse(localStorage.getItem("apiKeys") || `{ "gemini": "", "groq": "", "guru": "Guru Digital" }`);

  function saveBank() { localStorage.setItem('bankSoalFull', JSON.stringify(bankSoal)); }
  function saveSettings() { localStorage.setItem('examSettingsCplx', JSON.stringify(examSettings)); localStorage.setItem("apiKeys", JSON.stringify(apiKeys)); }

  // ========== RENDER MANUAL (DENGAN GAMBAR) ==========
  function renderManual() {
    return `
      <div class="card">
        <h2><i class="fas fa-hand-paper"></i> Buat Soal Manual (Dengan Gambar)</h2>
        <label>Pilih Mapel</label>
        <select id="manualMapel">${Object.keys(bankSoal).map(m => `<option value="${m}">${m}</option>`).join('')}</select>
        
        <label>Tipe Soal</label>
        <select id="manualTipe" onchange="toggleManualForm()">
          <option value="pg">Pilihan Ganda Biasa (A-D / A-E)</option>
          <option value="pgk">Pilihan Ganda Kompleks (Jawaban >1)</option>
          <option value="narasi">Narasi (1 Narasi untuk 3-5 Soal)</option>
          <option value="bs">Benar/Salah (5 Pernyataan)</option>
          <option value="stts">Setuju/Tidak Setuju (INK Model)</option>
          <option value="cukup">Kecukupan Data + Gambar di Opsi</option>
        </select>

        <div id="manualFormArea"></div>
        
        <button id="simpanManualBtn" class="btn-primary" style="margin-top:16px"><i class="fas fa-save"></i> Simpan ke Bank Soal</button>
      </div>
    `;
  }

  function toggleManualForm() {
    const tipe = document.getElementById('manualTipe').value;
    const area = document.getElementById('manualFormArea');
    if (!area) return;
    
    if (tipe === 'pg') {
      area.innerHTML = `
        <label>Teks Soal</label><textarea id="pgTeks" rows="2" placeholder="Masukkan pertanyaan"></textarea>
        <label>Gambar Soal (URL)</label><input id="pgGambar" placeholder="https://...">
        <label>Jumlah Opsi</label><select id="pgJmlOpsi" onchange="renderPGOptions()"><option value="4">A-D (SD/SMP)</option><option value="5">A-E (SMA)</option></select>
        <div id="pgOptionsArea"></div>
        <label>Jawaban Benar (bisa lebih dari 1, pisah koma)</label><input id="pgJawaban" placeholder="Contoh: 0,2 (artinya A dan C)">
      `;
      renderPGOptions();
    }
    else if (tipe === 'pgk') {
      area.innerHTML = `
        <label>Teks Soal</label><textarea id="pgkTeks" rows="2"></textarea>
        <label>Gambar Soal (URL)</label><input id="pgkGambar" placeholder="https://...">
        <div id="pgkOptionsArea"></div>
        <label>Jawaban Benar (pisah koma, contoh: 0,2,3)</label><input id="pgkJawaban" placeholder="Index opsi yang benar">
      `;
      renderPGKOptions();
    }
    else if (tipe === 'narasi') {
      area.innerHTML = `
        <label>Teks Narasi</label><textarea id="narasiTeks" rows="4" placeholder="Bacaan panjang untuk 3-5 soal"></textarea>
        <label>Gambar Narasi (URL)</label><input id="narasiGambar" placeholder="https://...">
        <label>Jumlah Soal dalam Narasi</label><input id="narasiJml" type="number" value="3" min="1" max="5" onchange="renderSubSoalForms()">
        <div id="subSoalContainer"></div>
      `;
      renderSubSoalForms();
    }
    else if (tipe === 'bs') {
      area.innerHTML = `
        <label>Teks Narasi</label><textarea id="bsNarasi" rows="3"></textarea>
        <label>Gambar (URL)</label><input id="bsGambar" placeholder="https://...">
        <div id="bsPernyataanContainer"></div>
        <label>Kunci Jawaban (B/S, pisah koma)</label><input id="bsKunci" placeholder="B,S,B,S,B">
      `;
      renderBSPernyataan();
    }
    else if (tipe === 'stts') {
      area.innerHTML = `
        <label>Teks Narasi</label><textarea id="sttsNarasi" rows="3"></textarea>
        <label>Gambar (URL)</label><input id="sttsGambar" placeholder="https://...">
        <div id="sttsPernyataanContainer"></div>
      `;
      renderSTTSPernyataan();
    }
    else if (tipe === 'cukup') {
      area.innerHTML = `
        <label>Teks Pertanyaan</label><textarea id="cukupTeks" rows="2"></textarea>
        <label>Pernyataan A</label><textarea id="cukupA" rows="2" placeholder="Pernyataan A"></textarea>
        <label>Gambar untuk Opsi A (URL)</label><input id="cukupAGambar" placeholder="https://...">
        <label>Pernyataan B</label><textarea id="cukupB" rows="2" placeholder="Pernyataan B"></textarea>
        <label>Gambar untuk Opsi B (URL)</label><input id="cukupBGambar" placeholder="https://...">
        <label>Gambar untuk Opsi C (URL)</label><input id="cukupCGambar" placeholder="https://...">
        <label>Gambar untuk Opsi D (URL)</label><input id="cukupDGambar" placeholder="https://...">
        <label>Kunci Jawaban (A/B/C/D)</label><select id="cukupKunci"><option value="A">A. Pernyataan A saja cukup</option><option value="B">B. Pernyataan B saja cukup</option><option value="C">C. A dan B cukup</option><option value="D">D. A dan B tidak cukup</option></select>
      `;
    }
  }

  function renderPGOptions() {
    const jml = parseInt(document.getElementById('pgJmlOpsi').value);
    const container = document.getElementById('pgOptionsArea');
    if (!container) return;
    let html = '<label>Opsi Jawaban + Gambar</label>';
    for (let i = 0; i < jml; i++) {
      const huruf = String.fromCharCode(65 + i);
      html += `
        <div class="option-with-img">
          <strong>${huruf}.</strong>
          <input type="text" id="pgOpt${i}" placeholder="Teks opsi ${huruf}" style="flex:1">
          <input type="text" id="pgOptImg${i}" placeholder="URL gambar (opsional)" style="width:150px">
        </div>
      `;
    }
    container.innerHTML = html;
  }

  function renderPGKOptions() {
    const container = document.getElementById('pgkOptionsArea');
    if (!container) return;
    let html = '<label>Opsi Jawaban (A-D)</label>';
    for (let i = 0; i < 4; i++) {
      const huruf = String.fromCharCode(65 + i);
      html += `
        <div class="option-with-img">
          <strong>${huruf}.</strong>
          <input type="text" id="pgkOpt${i}" placeholder="Teks opsi ${huruf}" style="flex:1">
          <input type="text" id="pgkOptImg${i}" placeholder="URL gambar" style="width:150px">
        </div>
      `;
    }
    container.innerHTML = html;
  }

  function renderSubSoalForms() {
    const jml = parseInt(document.getElementById('narasiJml').value) || 3;
    const container = document.getElementById('subSoalContainer');
    if (!container) return;
    let html = '<h4>Soal-soal dalam Narasi</h4>';
    for (let i = 0; i < jml; i++) {
      html += `
        <div class="subsoal-form">
          <strong>Soal ${i+1}</strong>
          <input type="text" id="subTeks${i}" placeholder="Pertanyaan soal ${i+1}">
          <div class="flex-row">
            <input type="text" id="subOptA${i}" placeholder="Opsi A" style="width:30%">
            <input type="text" id="subOptB${i}" placeholder="Opsi B" style="width:30%">
            <input type="text" id="subOptC${i}" placeholder="Opsi C" style="width:30%">
            <input type="text" id="subOptD${i}" placeholder="Opsi D" style="width:30%">
          </div>
          <label>Jawaban Benar</label><select id="subJawaban${i}"><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option></select>
        </div>
      `;
    }
    container.innerHTML = html;
  }

  function renderBSPernyataan() {
    const container = document.getElementById('bsPernyataanContainer');
    if (!container) return;
    let html = '<h4>5 Pernyataan Benar/Salah</h4>';
    for (let i = 0; i < 5; i++) {
      html += `<input type="text" id="bsPernyataan${i}" placeholder="Pernyataan ${i+1}" style="margin:6px 0">`;
    }
    container.innerHTML = html;
  }

  function renderSTTSPernyataan() {
    const container = document.getElementById('sttsPernyataanContainer');
    if (!container) return;
    let html = '<h4>5 Pernyataan (Setuju/Tidak Setuju)</h4>';
    for (let i = 0; i < 5; i++) {
      html += `<input type="text" id="sttsPernyataan${i}" placeholder="Pernyataan ${i+1}" style="margin:6px 0">`;
    }
    container.innerHTML = html;
  }

  // Simpan Manual
  function simpanManual() {
    const mapel = document.getElementById('manualMapel').value;
    const tipe = document.getElementById('manualTipe').value;
    
    if (tipe === 'pg') {
      const teks = document.getElementById('pgTeks').value;
      const gambar = document.getElementById('pgGambar').value;
      const jml = parseInt(document.getElementById('pgJmlOpsi').value);
      const opsi = [];
      for (let i = 0; i < jml; i++) {
        opsi.push({
          label: String.fromCharCode(65+i),
          teks: document.getElementById(`pgOpt${i}`)?.value || '',
          gambar: document.getElementById(`pgOptImg${i}`)?.value || ''
        });
      }
      const jawabanRaw = document.getElementById('pgJawaban').value;
      const jawaban = jawabanRaw.split(',').map(Number);
      bankSoal[mapel].push({ tipe: 'PG', teks, gambar, opsi, jawaban, multi: jawaban.length > 1 });
    }
    else if (tipe === 'pgk') {
      const teks = document.getElementById('pgkTeks').value;
      const gambar = document.getElementById('pgkGambar').value;
      const opsi = [];
      for (let i = 0; i < 4; i++) {
        opsi.push({
          label: String.fromCharCode(65+i),
          teks: document.getElementById(`pgkOpt${i}`)?.value || '',
          gambar: document.getElementById(`pgkOptImg${i}`)?.value || ''
        });
      }
      const jawaban = document.getElementById('pgkJawaban').value.split(',').map(Number);
      bankSoal[mapel].push({ tipe: 'PGK', teks, gambar, opsi, jawaban, multi: true });
    }
    else if (tipe === 'narasi') {
      const narasi = document.getElementById('narasiTeks').value;
      const gambar = document.getElementById('narasiGambar').value;
      const jml = parseInt(document.getElementById('narasiJml').value);
      const soalList = [];
      for (let i = 0; i < jml; i++) {
        soalList.push({
          teks: document.getElementById(`subTeks${i}`)?.value || '',
          opsi: [
            document.getElementById(`subOptA${i}`)?.value || '',
            document.getElementById(`subOptB${i}`)?.value || '',
            document.getElementById(`subOptC${i}`)?.value || '',
            document.getElementById(`subOptD${i}`)?.value || ''
          ],
          jawaban: [document.getElementById(`subJawaban${i}`)?.value || 'A']
        });
      }
      bankSoal[mapel].push({ tipe: 'NARASI', narasi, gambar, soalList });
    }
    else if (tipe === 'bs') {
      const narasi = document.getElementById('bsNarasi').value;
      const gambar = document.getElementById('bsGambar').value;
      const pernyataan = [];
      for (let i = 0; i < 5; i++) {
        pernyataan.push(document.getElementById(`bsPernyataan${i}`)?.value || '');
      }
      const kunci = document.getElementById('bsKunci').value.split(',');
      bankSoal[mapel].push({ tipe: 'BS', teks: narasi, gambar, pernyataan, kunci });
    }
    else if (tipe === 'stts') {
      const narasi = document.getElementById('sttsNarasi').value;
      const gambar = document.getElementById('sttsGambar').value;
      const pernyataan = [];
      for (let i = 0; i < 5; i++) {
        pernyataan.push(document.getElementById(`sttsPernyataan${i}`)?.value || '');
      }
      bankSoal[mapel].push({ tipe: 'STTS', teks: narasi, gambar, pernyataan });
    }
    else if (tipe === 'cukup') {
      bankSoal[mapel].push({
        tipe: 'CUKUP',
        teks: document.getElementById('cukupTeks').value,
        pernyataanA: document.getElementById('cukupA').value,
        pernyataanB: document.getElementById('cukupB').value,
        opsiGambar: {
          A: document.getElementById('cukupAGambar').value,
          B: document.getElementById('cukupBGambar').value,
          C: document.getElementById('cukupCGambar').value,
          D: document.getElementById('cukupDGambar').value
        },
        kunci: document.getElementById('cukupKunci').value
      });
    }
    
    saveBank();
    Swal.fire('Tersimpan!', `Soal ${tipe} ditambahkan ke ${mapel}`, 'success');
  }

  // ========== AI GENERATE (dengan dukungan gambar rekomendasi) ==========
  async function callAIGenerate(prompt, tipeSoalTarget) {
    let apiKey = apiKeys.gemini;
    if (!apiKey) { Swal.fire("Error", "API Key Gemini belum diisi"); return null; }
    let endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-exp:generateContent?key=${apiKey}`;
    
    let instruction = `Buatkan soal ujian dengan format JSON, termasuk rekomendasi URL gambar (unsplash atau placeholder) untuk soal dan opsi jika relevan.
Konteks: ${prompt.substring(0, 1500)}
Tipe soal: ${tipeSoalTarget}

Format JSON output HARUS seperti contoh:
{
  "tipe": "PG",
  "teks": "Pertanyaan soal?",
  "gambar_soal": "https://picsum.photos/id/1/200/150",
  "opsi": [
    {"label": "A", "teks": "Opsi A", "gambar": "https://..."},
    {"label": "B", "teks": "Opsi B", "gambar": ""}
  ],
  "jawaban": [0]
}

Untuk tipe NARASI:
{
  "tipe": "NARASI",
  "narasi": "Teks bacaan...",
  "gambar_narasi": "https://...",
  "soalList": [
    {"teks": "Soal 1?", "opsi": ["A1","B1","C1","D1"], "jawaban": ["A"]}
  ]
}

Hanya output JSON, tanpa teks lain.`;

    try {
      const payload = { contents: [{ parts: [{ text: instruction }] }], generationConfig: { temperature: 0.7, maxOutputTokens: 2048 } };
      const resp = await fetch(endpoint, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
      const data = await resp.json();
      if (data.error) throw new Error(data.error.message);
      return data.candidates[0].content.parts[0].text;
    } catch (err) { Swal.fire("API Error", err.message); return null; }
  }

  function renderAIGenerate() {
    return `
      <div class="card">
        <h2><i class="fas fa-microchip"></i> AI Generate Soal + Rekomendasi Gambar</h2>
        <label>Target Mapel</label>
        <select id="aiMapel">${Object.keys(bankSoal).map(m => `<option value="${m}">${m}</option>`).join('')}</select>
        <label>Tipe Soal</label>
        <select id="aiTipe">
          <option value="PG">Pilihan Ganda</option>
          <option value="PGK">PG Kompleks</option>
          <option value="NARASI">Narasi (3-5 soal)</option>
          <option value="BS">Benar/Salah</option>
          <option value="STTS">Setuju/Tidak Setuju</option>
          <option value="CUKUP">Kecukupan Data</option>
        </select>
        <label>Prompt Materi</label>
        <textarea id="aiPrompt" rows="4" placeholder="Contoh: Buat soal tentang fotosintesis kelas 8, sertakan rekomendasi gambar"></textarea>
        <button id="genAIBtn" class="btn-primary"><i class="fas fa-magic"></i> Generate Soal + Gambar</button>
        <label>Hasil Generate (JSON - bisa diedit)</label>
        <div id="aiResultEditor" contenteditable="true" class="soal-editor" style="min-height:200px;">Hasil AI akan muncul disini (format JSON)</div>
        <button id="simpanAIKeBank" class="btn-primary" style="margin-top:12px">Simpan ke Bank Soal</button>
      </div>
    `;
  }

  // ========== RENDER BANK, MAKER, CBT, SETTINGS (SEDERHANA) ==========
  function renderBankSoal() {
    return `<div class="card"><h2>Bank Soal</h2><pre>${JSON.stringify(bankSoal, null, 2)}</pre></div>`;
  }
  function renderTestMaker() { return `<div class="card"><h2>Test Maker</h2><p>Pengaturan ujian menyusul</p></div>`; }
  function renderCBT() { return `<div class="card"><h2>CBT Mode</h2><p>Fitur CBT akan aktif setelah bank soal berisi data</p></div>`; }
  function renderSettings() {
    return `<div class="card"><h2>Settings API</h2><label>Gemini Key</label><input id="geminiKey" value="${apiKeys.gemini}"><button id="saveApiBtn" class="btn-primary">Simpan</button></div>`;
  }

  // ========== NAVIGASI & EVENT ==========
  function render() {
    const menu = document.querySelector('.nav-item.active')?.dataset.menu || 'manual';
    const panel = document.getElementById('mainPanel');
    if (menu === 'manual') panel.innerHTML = renderManual();
    else if (menu === 'ai-generate') panel.innerHTML = renderAIGenerate();
    else if (menu === 'bank') panel.innerHTML = renderBankSoal();
    else if (menu === 'maker') panel.innerHTML = renderTestMaker();
    else if (menu === 'cbt') panel.innerHTML = renderCBT();
    else if (menu === 'settings') panel.innerHTML = renderSettings();
    
    if (menu === 'manual') {
      toggleManualForm();
      document.getElementById('simpanManualBtn')?.addEventListener('click', simpanManual);
      document.getElementById('manualTipe')?.addEventListener('change', toggleManualForm);
      window.renderPGOptions = renderPGOptions;
      window.renderPGKOptions = renderPGKOptions;
      window.renderSubSoalForms = renderSubSoalForms;
      window.renderBSPernyataan = renderBSPernyataan;
      window.renderSTTSPernyataan = renderSTTSPernyataan;
      window.toggleManualForm = toggleManualForm;
    }
    if (menu === 'ai-generate') {
      document.getElementById('genAIBtn')?.addEventListener('click', async () => {
        const prompt = document.getElementById('aiPrompt').value;
        const tipe = document.getElementById('aiTipe').value;
        if (!prompt) { Swal.fire('Isi prompt dulu'); return; }
        Swal.fire({ title: 'AI Working...', didOpen: () => Swal.showLoading() });
        const result = await callAIGenerate(prompt, tipe);
        Swal.close();
        if (result) document.getElementById('aiResultEditor').innerText = result;
      });
      document.getElementById('simpanAIKeBank')?.addEventListener('click', () => {
        const jsonText = document.getElementById('aiResultEditor').innerText;
        const mapel = document.getElementById('aiMapel').value;
        try {
          const soal = JSON.parse(jsonText);
          bankSoal[mapel].push(soal);
          saveBank();
          Swal.fire('Sukses', 'Soal AI tersimpan ke bank', 'success');
        } catch(e) { Swal.fire('Error', 'Format JSON tidak valid', 'error'); }
      });
    }
    if (menu === 'settings') {
      document.getElementById('saveApiBtn')?.addEventListener('click', () => {
        apiKeys.gemini = document.getElementById('geminiKey').value;
        saveSettings();
        Swal.fire('Tersimpan');
      });
    }
  }

  document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => {
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      item.classList.add('active');
      render();
    });
  });
  render();
</script>
</body>
</html>
