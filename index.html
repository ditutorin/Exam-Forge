<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>ExamForge Pro | Generator Soal + Bank Soal</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    
    body {
      background: linear-gradient(135deg, #d4f5e8 0%, #a8e6cf 50%, #7bc5ae 100%);
      min-height: 100vh;
    }
    
    /* Navbar Top */
    .navbar {
      background: linear-gradient(135deg, #0a3d2e, #0b4a38);
      padding: 16px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    
    .logo {
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, #d4ffb0, #88e0b0);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .logo i { font-size: 1.8rem; color: #88e0b0; background: none; -webkit-background-clip: unset; background-clip: unset; color: #a8e6cf; }
    
    .nav-links {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    
    .nav-btn {
      background: rgba(255,255,255,0.1);
      border: none;
      padding: 10px 20px;
      border-radius: 40px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .nav-btn.active, .nav-btn:hover {
      background: linear-gradient(135deg, #2a9d6e, #1b7a52);
      transform: translateY(-2px);
    }
    
    .api-status {
      background: rgba(0,0,0,0.3);
      padding: 6px 14px;
      border-radius: 40px;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .api-status.valid { background: #2e7d32; }
    .api-status.invalid { background: #c62828; }
    
    /* Main Container */
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px;
    }
    
    /* Card */
    .card {
      background: rgba(255,255,255,0.95);
      border-radius: 28px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
    }
    
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 2px solid #e0f0e0;
    }
    
    /* Mapel Tags */
    .mapel-container {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }
    
    .mapel-tag {
      background: #e8f5e9;
      padding: 8px 16px;
      border-radius: 40px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
    }
    
    .mapel-tag.active {
      background: linear-gradient(135deg, #2e7d32, #1b5e20);
      color: white;
    }
    
    .mapel-tag i { cursor: pointer; opacity: 0.7; }
    .mapel-tag i:hover { opacity: 1; color: #ff9999; }
    
    .btn-add-mapel {
      background: transparent;
      border: 2px dashed #2e7d32;
      padding: 8px 16px;
      border-radius: 40px;
      cursor: pointer;
      color: #2e7d32;
      font-weight: 500;
    }
    
    /* Form */
    .form-group {
      margin-bottom: 20px;
    }
    
    label {
      font-weight: 600;
      color: #1c4d2d;
      display: block;
      margin-bottom: 6px;
    }
    
    input, select, textarea {
      width: 100%;
      padding: 12px 18px;
      border-radius: 28px;
      border: 1.5px solid #cfe3cf;
      background: white;
      font-size: 0.9rem;
    }
    
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #2e7d32;
      box-shadow: 0 0 0 3px rgba(46,125,50,0.2);
    }
    
    /* Buttons */
    .btn {
      border: none;
      padding: 10px 24px;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    
    .btn-primary { background: linear-gradient(135deg, #2e7d32, #1b5e20); color: white; }
    .btn-primary:hover { transform: scale(0.98); }
    .btn-outline { background: transparent; border: 2px solid #2e7d32; color: #1b5e20; }
    .btn-outline:hover { background: #2e7d32; color: white; }
    .btn-danger { background: #d32f2f; color: white; }
    .btn-sm { padding: 6px 14px; font-size: 0.8rem; }
    
    /* Soal Editor */
    .soal-editor {
      background: #fffbe6;
      border-radius: 20px;
      padding: 20px;
      border-left: 5px solid #2e7d32;
      font-family: monospace;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
      min-height: 250px;
      max-height: 400px;
      overflow: auto;
    }
    
    /* Soal Card di Bank */
    .soal-card {
      background: #f9fff9;
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 16px;
      border-left: 5px solid #2e7d32;
      position: relative;
    }
    
    .soal-card-actions {
      position: absolute;
      top: 12px;
      right: 16px;
      display: flex;
      gap: 8px;
    }
    
    .soal-card pre {
      font-family: monospace;
      font-size: 13px;
      white-space: pre-wrap;
      margin-top: 8px;
      padding-right: 100px;
    }
    
    .badge-soal {
      display: inline-block;
      background: #e8f5e9;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 600;
      margin-bottom: 8px;
    }
    
    /* Grid */
    .flex-row { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
    
    hr { margin: 16px 0; border: none; border-top: 1px solid #e0f0e0; }
    
    @media (max-width: 700px) {
      .navbar { flex-direction: column; text-align: center; }
      .soal-card-actions { position: static; margin-top: 12px; justify-content: flex-end; }
      .soal-card pre { padding-right: 0; }
    }
  </style>
</head>
<body>

<div class="navbar">
  <div class="logo">
    <i class="fas fa-brain"></i>
    <span>ExamForge Pro</span>
  </div>
  <div class="nav-links">
    <button class="nav-btn" data-menu="generate"><i class="fas fa-microchip"></i> AI Generate</button>
    <button class="nav-btn" data-menu="manual"><i class="fas fa-pen-alt"></i> Buat Manual</button>
    <button class="nav-btn" data-menu="bank"><i class="fas fa-database"></i> Bank Soal</button>
    <button class="nav-btn" data-menu="settings"><i class="fas fa-cog"></i> Settings</button>
  </div>
  <div class="api-status invalid" id="apiStatus">
    <i class="fas fa-circle"></i> API Key: Belum Diset
  </div>
</div>

<div class="container" id="mainContainer"></div>

<script>
  // ========== GLOBAL STATE ==========
  let currentMenu = "generate";
  let currentMapel = "Matematika";
  let bankSoal = {};  // { "Matematika": [ { id, raw, tipe, createdAt } ] }
  let apiKey = localStorage.getItem("geminiApiKey") || "";
  let gasUrl = localStorage.getItem("gasUrl") || "";
  let nextId = 1;
  
  // ========== UTILITY ==========
  function updateApiStatus() {
    const el = document.getElementById("apiStatus");
    if (apiKey && apiKey.startsWith("AIza")) {
      el.className = "api-status valid";
      el.innerHTML = '<i class="fas fa-check-circle"></i> Gemini API: Aktif';
    } else {
      el.className = "api-status invalid";
      el.innerHTML = '<i class="fas fa-exclamation-circle"></i> API Key: Belum Diset';
    }
  }
  
  function saveToLocal() {
    localStorage.setItem("bankSoalV2", JSON.stringify(bankSoal));
    localStorage.setItem("currentMapel", currentMapel);
    localStorage.setItem("geminiApiKey", apiKey);
    localStorage.setItem("gasUrl", gasUrl);
  }
  
  function loadFromLocal() {
    const saved = localStorage.getItem("bankSoalV2");
    if (saved) bankSoal = JSON.parse(saved);
    const savedMapel = localStorage.getItem("currentMapel");
    if (savedMapel) currentMapel = savedMapel;
    apiKey = localStorage.getItem("geminiApiKey") || "";
    gasUrl = localStorage.getItem("gasUrl") || "";
    
    // Generate ID terbesar untuk nextId
    let maxId = 0;
    Object.values(bankSoal).forEach(soals => {
      soals.forEach(s => { if (s.id > maxId) maxId = s.id; });
    });
    nextId = maxId + 1;
    
    updateApiStatus();
  }
  
  // ========== PARSER: Pisahkan teks jadi array soal ==========
  function parseSoalDariTeks(rawText) {
    // Split berdasarkan delimiter === SOAL atau === Soal atau === soal
    const delimiter = /===+\s*(SOAL|Soal|soal)\s*\d*\s*===+/gi;
    const blocks = rawText.split(delimiter);
    
    const soalList = [];
    let currentBlock = "";
    
    for (let i = 0; i < blocks.length; i++) {
      if (blocks[i].match(/^===/)) continue; // skip delimiter
      currentBlock = blocks[i].trim();
      if (currentBlock.length > 20) {
        // Deteksi tipe soal dari konten
        let tipe = "PG";
        if (currentBlock.toLowerCase().includes("narasi")) tipe = "NARASI";
        else if (currentBlock.toLowerCase().includes("benar/salah") || currentBlock.toLowerCase().includes("pernyataan")) tipe = "BS";
        else if (currentBlock.toLowerCase().includes("setuju")) tipe = "STTS";
        
        soalList.push({
          id: nextId++,
          raw: currentBlock,
          tipe: tipe,
          createdAt: new Date().toISOString()
        });
      }
    }
    
    // Jika tidak terdeteksi delimiter, anggap 1 soal utuh
    if (soalList.length === 0 && rawText.trim().length > 20) {
      soalList.push({
        id: nextId++,
        raw: rawText.trim(),
        tipe: "PG",
        createdAt: new Date().toISOString()
      });
    }
    
    return soalList;
  }
  
  // ========== SIMPAN KE BANK SOAL (Otomatis parse) ==========
  function simpanKeBankSoal(rawText, mapel = currentMapel) {
    if (!rawText || rawText.trim() === "") {
      Swal.fire("Kosong", "Tidak ada soal yang disimpan", "warning");
      return false;
    }
    
    const parsedSoal = parseSoalDariTeks(rawText);
    
    if (!bankSoal[mapel]) bankSoal[mapel] = [];
    
    for (let soal of parsedSoal) {
      bankSoal[mapel].push(soal);
    }
    
    saveToLocal();
    
    // Sync ke GAS jika ada URL
    if (gasUrl) {
      syncToGAS(mapel, parsedSoal);
    }
    
    return parsedSoal.length;
  }
  
  async function syncToGAS(mapel, soalArray) {
    try {
      for (let soal of soalArray) {
        await fetch(gasUrl, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "saveSoal",
            mapel: mapel,
            soal: soal
          })
        });
      }
      console.log(`Sync ${soalArray.length} soal ke GAS untuk ${mapel}`);
    } catch(e) {
      console.error("GAS sync error:", e);
    }
  }
  
  // ========== HAPUS SOAL ==========
  function hapusSoal(mapel, id) {
    if (!bankSoal[mapel]) return;
    const index = bankSoal[mapel].findIndex(s => s.id === id);
    if (index !== -1) {
      bankSoal[mapel].splice(index, 1);
      saveToLocal();
      render();
    }
  }
  
  // ========== TAMBAH MAPEL ==========
  async function tambahMapel() {
    const { value: newMapel } = await Swal.fire({
      title: "Tambah Mapel Baru",
      input: "text",
      inputPlaceholder: "Contoh: Fisika, Kimia, Ekonomi, Sejarah",
      showCancelButton: true
    });
    if (newMapel && newMapel.trim() && !bankSoal[newMapel.trim()]) {
      bankSoal[newMapel.trim()] = [];
      saveToLocal();
      currentMapel = newMapel.trim();
      render();
      Swal.fire("Berhasil!", `Mapel ${newMapel} ditambahkan`, "success");
    } else if (bankSoal[newMapel]) {
      Swal.fire("Gagal", "Mapel sudah ada", "error");
    }
  }
  
  function hapusMapel(mapel) {
    if (mapel === currentMapel) {
      Swal.fire("Tidak bisa", "Pilih mapel lain dulu", "warning");
      return;
    }
    Swal.fire({
      title: `Hapus ${mapel}?`,
      text: "Semua soal akan hilang!",
      icon: "warning",
      showCancelButton: true
    }).then(res => {
      if (res.isConfirmed) {
        delete bankSoal[mapel];
        saveToLocal();
        render();
      }
    });
  }
  
  // ========== RENDER MAPEL TAGS ==========
  function renderMapelTags(containerId) {
    const container = document.getElementById(containerId);
    if (!container) return;
    
    const mapels = Object.keys(bankSoal);
    if (mapels.length === 0) {
      bankSoal["Matematika"] = [];
      bankSoal["IPA"] = [];
      bankSoal["Bahasa Inggris"] = [];
      saveToLocal();
    }
    
    let html = `<div class="mapel-container">`;
    Object.keys(bankSoal).forEach(m => {
      html += `<div class="mapel-tag ${currentMapel === m ? 'active' : ''}" data-mapel="${m}">
        ${m}
        <i class="fas fa-times-circle" onclick="event.stopPropagation(); hapusMapel('${m}')"></i>
      </div>`;
    });
    html += `<button class="btn-add-mapel" id="btnTambahMapel"><i class="fas fa-plus"></i> Tambah Mapel</button></div>`;
    container.innerHTML = html;
    
    document.querySelectorAll('.mapel-tag').forEach(tag => {
      tag.addEventListener('click', (e) => {
        if (e.target.tagName !== 'I') {
          currentMapel = tag.dataset.mapel;
          render();
        }
      });
    });
    document.getElementById('btnTambahMapel')?.addEventListener('click', tambahMapel);
  }
  
  // ========== AI GENERATE ==========
  async function generateSoalAI() {
    const prompt = document.getElementById("aiPrompt").value;
    const tipe = document.getElementById("aiTipe").value;
    
    if (!prompt) { Swal.fire("Isi prompt materi dulu"); return; }
    if (!apiKey || !apiKey.startsWith("AIza")) {
      Swal.fire("API Key Belum Diset", "Masukkan Gemini API Key di menu Settings", "warning");
      return;
    }
    
    Swal.fire({ title: "AI Sedang Membuat Soal...", didOpen: () => Swal.showLoading() });
    
    let instruction = `Buatkan ${tipe === "NARASI" ? "1 narasi panjang dengan 3-5 sub soal" : "3-5 soal"} dengan format TEKS biasa seperti contoh:

=== SOAL 1 ===
Tipe: PG
Teks: Pertanyaan?
A. Opsi A
B. Opsi B
C. Opsi C
D. Opsi D
Jawaban: A

=== SOAL 2 ===
Tipe: PG
Teks: Pertanyaan 2?
A. Opsi A
B. Opsi B
C. Opsi C
D. Opsi D
Jawaban: B

${tipe === "NARASI" ? `=== NARASI ===
Teks: Bacaan narasi panjang...

=== SOAL 1 ===
Pertanyaan: ...?
A. ...
B. ...
C. ...
D. ...
Jawaban: A` : tipe === "BS" ? `=== SOAL ===
Tipe: BS
Narasi: Teks materi...
Pernyataan 1: ...
Pernyataan 2: ...
Pernyataan 3: ...
Pernyataan 4: ...
Pernyataan 5: ...
Kunci Jawaban: B,S,B,S,B` : ""}

Materi: ${prompt}
Jangan tambahkan teks di luar format soal. Langsung soal saja.`;
    
    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ parts: [{ text: instruction }] }],
          generationConfig: { temperature: 0.7, maxOutputTokens: 2048 }
        })
      });
      
      const data = await response.json();
      Swal.close();
      
      if (data.error) throw new Error(data.error.message);
      const result = data.candidates[0].content.parts[0].text;
      
      document.getElementById("aiResult").innerText = result;
      Swal.fire("Berhasil!", "Soal sudah digenerate, bisa diedit lalu simpan", "success");
      
    } catch(e) {
      Swal.close();
      Swal.fire("Error", e.message, "error");
    }
  }
  
  // ========== RENDER ==========
  function render() {
    const container = document.getElementById("mainContainer");
    
    if (currentMenu === "generate") {
      container.innerHTML = `
        <div class="card">
          <div class="card-header">
            <h2><i class="fas fa-microchip"></i> AI Generate Soal</h2>
            <div id="mapelTagsGenerate"></div>
          </div>
          <div class="form-group">
            <label><i class="fas fa-list"></i> Tipe Soal</label>
            <select id="aiTipe">
              <option value="PG">Pilihan Ganda (PG)</option>
              <option value="NARASI">Narasi + Sub Soal</option>
              <option value="BS">Benar/Salah (5 Pernyataan)</option>
            </select>
          </div>
          <div class="form-group">
            <label><i class="fas fa-book"></i> Materi / Prompt</label>
            <textarea id="aiPrompt" rows="4" placeholder="Contoh: Buat soal tentang sistem pernapasan manusia untuk kelas 8, tingkat HOTS"></textarea>
          </div>
          <button id="btnGenerateAI" class="btn-primary"><i class="fas fa-magic"></i> Generate Soal</button>
          
          <hr>
          
          <div class="flex-between">
            <label><i class="fas fa-edit"></i> Hasil Generate (Edit Bebas)</label>
            <button id="btnSimpanHasil" class="btn-outline btn-sm"><i class="fas fa-save"></i> Simpan ke Bank Soal (${currentMapel})</button>
          </div>
          <div id="aiResult" class="soal-editor" contenteditable="true">Hasil generate akan muncul di sini... Bisa diedit langsung.</div>
        </div>
      `;
      renderMapelTags("mapelTagsGenerate");
      document.getElementById("btnGenerateAI")?.addEventListener("click", generateSoalAI);
      document.getElementById("btnSimpanHasil")?.addEventListener("click", () => {
        const teks = document.getElementById("aiResult").innerText;
        const jumlah = simpanKeBankSoal(teks, currentMapel);
        if (jumlah > 0) {
          Swal.fire("Tersimpan!", `${jumlah} soal disimpan ke ${currentMapel}`, "success");
          document.getElementById("aiResult").innerText = "";
        }
      });
    }
    else if (currentMenu === "manual") {
      container.innerHTML = `
        <div class="card">
          <div class="card-header">
            <h2><i class="fas fa-pen-alt"></i> Buat Soal Manual</h2>
            <div id="mapelTagsManual"></div>
          </div>
          <div class="form-group">
            <label><i class="fas fa-quote-left"></i> Tulis Soal (format bebas, pisahkan dengan === SOAL === untuk multiple)</label>
            <textarea id="manualSoal" rows="12" class="soal-editor" style="font-family:monospace" placeholder="Contoh:
=== SOAL 1 ===
Tipe: PG
Teks: Apa ibu kota Indonesia?
A. Jakarta
B. Surabaya
C. Bandung
D. Medan
Jawaban: A

=== SOAL 2 ===
Tipe: PG
Teks: Siapa presiden pertama?
A. Soeharto
B. Soekarno
C. Habibie
D. Gus Dur
Jawaban: B"></textarea>
          </div>
          <button id="btnSimpanManual" class="btn-primary"><i class="fas fa-save"></i> Simpan ke Bank Soal (${currentMapel})</button>
        </div>
      `;
      renderMapelTags("mapelTagsManual");
      document.getElementById("btnSimpanManual")?.addEventListener("click", () => {
        const teks = document.getElementById("manualSoal").value;
        const jumlah = simpanKeBankSoal(teks, currentMapel);
        if (jumlah > 0) {
          Swal.fire("Tersimpan!", `${jumlah} soal disimpan ke ${currentMapel}`, "success");
          document.getElementById("manualSoal").value = "";
        } else {
          Swal.fire("Kosong", "Tulis soal dulu", "warning");
        }
      });
    }
    else if (currentMenu === "bank") {
      const soals = bankSoal[currentMapel] || [];
      container.innerHTML = `
        <div class="card">
          <div class="card-header">
            <h2><i class="fas fa-database"></i> Bank Soal</h2>
            <div id="mapelTagsBank"></div>
          </div>
          <div class="flex-between" style="margin-bottom: 16px;">
            <span class="badge-soal"><i class="fas fa-list"></i> Total: ${soals.length} soal</span>
            <button id="btnExportBank" class="btn-outline btn-sm"><i class="fas fa-download"></i> Export Semua</button>
          </div>
          <div id="bankSoalList">
            ${soals.length === 0 ? '<i>Tidak ada soal. Generate atau buat manual dulu.</i>' : 
              soals.map(s => `
                <div class="soal-card">
                  <div class="soal-card-actions">
                    <button class="btn-outline btn-sm btn-edit" data-id="${s.id}"><i class="fas fa-edit"></i> Edit</button>
                    <button class="btn-danger btn-sm btn-hapus" data-id="${s.id}"><i class="fas fa-trash"></i> Hapus</button>
                  </div>
                  <span class="badge-soal">ID: ${s.id} | ${s.tipe} | ${new Date(s.createdAt).toLocaleDateString()}</span>
                  <pre>${escapeHtml(s.raw)}</pre>
                </div>
              `).join('')}
          </div>
        </div>
      `;
      renderMapelTags("mapelTagsBank");
      
      // Event hapus
      document.querySelectorAll(".btn-hapus").forEach(btn => {
        btn.addEventListener("click", (e) => {
          const id = parseInt(btn.dataset.id);
          hapusSoal(currentMapel, id);
        });
      });
      
      // Event edit
      document.querySelectorAll(".btn-edit").forEach(btn => {
        btn.addEventListener("click", async (e) => {
          const id = parseInt(btn.dataset.id);
          const soal = bankSoal[currentMapel].find(s => s.id === id);
          if (soal) {
            const { value: newText } = await Swal.fire({
              title: "Edit Soal",
              input: "textarea",
              inputValue: soal.raw,
              inputPlaceholder: "Edit teks soal...",
              showCancelButton: true,
              inputAttributes: { style: "font-family:monospace; height:300px" }
            });
            if (newText) {
              soal.raw = newText;
              soal.createdAt = new Date().toISOString();
              saveToLocal();
              render();
              Swal.fire("Tersimpan!", "Soal sudah diupdate", "success");
            }
          }
        });
      });
      
      document.getElementById("btnExportBank")?.addEventListener("click", () => {
        const allSoals = bankSoal[currentMapel] || [];
        const exportText = allSoals.map(s => `=== SOAL ${s.id} ===\n${s.raw}`).join("\n\n");
        const blob = new Blob([exportText], { type: "text/plain" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `${currentMapel}_bank_soal.txt`;
        a.click();
        URL.revokeObjectURL(a.href);
      });
    }
    else if (currentMenu === "settings") {
      container.innerHTML = `
        <div class="card">
          <h2><i class="fas fa-cog"></i> Settings</h2>
          <div class="form-group">
            <label><i class="fab fa-google"></i> Gemini API Key</label>
            <input type="text" id="settingsApiKey" value="${apiKey}" placeholder="AIzaSy...">
            <small style="color: #666;">Dapatkan di <a href="https://aistudio.google.com" target="_blank">AI Studio Google</a></small>
          </div>
          <div class="form-group">
            <label><i class="fas fa-cloud-upload-alt"></i> Google Apps Script URL (opsional)</label>
            <input type="text" id="settingsGasUrl" value="${gasUrl}" placeholder="https://script.google.com/macros/s/.../exec">
            <small>Isi jika ingin sync ke Google Sheets</small>
          </div>
          <div class="flex-row">
            <button id="btnSaveSettings" class="btn-primary"><i class="fas fa-save"></i> Simpan</button>
            <button id="btnTestGas" class="btn-outline"><i class="fas fa-vial"></i> Test GAS</button>
          </div>
        </div>
      `;
      document.getElementById("btnSaveSettings")?.addEventListener("click", () => {
        apiKey = document.getElementById("settingsApiKey").value;
        gasUrl = document.getElementById("settingsGasUrl").value;
        saveToLocal();
        updateApiStatus();
        Swal.fire("Tersimpan!", "API Key dan GAS URL disimpan", "success");
      });
      document.getElementById("btnTestGas")?.addEventListener("click", async () => {
        if (!gasUrl) { Swal.fire("GAS URL kosong"); return; }
        try {
          await fetch(gasUrl, { method: "GET", mode: "no-cors" });
          Swal.fire("Test", "Request dikirim (no-cors mode)", "info");
        } catch(e) {
          Swal.fire("Error", e.message, "error");
        }
      });
    }
  }
  
  function escapeHtml(str) {
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }
  
  // ========== NAVIGASI ==========
  document.querySelectorAll(".nav-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentMenu = btn.dataset.menu;
      render();
    });
  });
  
  // ========== INIT ==========
  loadFromLocal();
  render();
</script>
</body>
</html>
