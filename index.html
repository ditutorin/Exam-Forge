<!DOCTYPE html>
<html lang='id'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0, user-scalable=yes'>
  <title>ExamForge Pro | AI CBT Platform</title>
  
  <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css'>
  <link href='https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap' rel='stylesheet'>
  <script src='https://cdn.jsdelivr.net/npm/sweetalert2@11'></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background: linear-gradient(135deg, #d4f5e8 0%, #a8e6cf 50%, #7bc5ae 100%); min-height: 100vh; display: flex; }
    .sidebar {
      width: 280px;
      background: linear-gradient(180deg, #0a3d2e 0%, #0b4a38 50%, #0a3d2e 100%);
      color: white;
      display: flex;
      flex-direction: column;
      padding: 28px 20px;
      box-shadow: 8px 0 32px rgba(0, 0, 0, 0.15);
      z-index: 20;
      overflow-y: auto;
    }
    .logo { font-size: 1.8rem; font-weight: 800; margin-bottom: 40px; background: linear-gradient(135deg, #d4ffb0, #88e0b0); -webkit-background-clip: text; background-clip: text; color: transparent; display: flex; align-items: center; gap: 12px; }
    .logo i { font-size: 2rem; background: linear-gradient(135deg, #ffffff, #b8f0d0); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      margin: 6px 0;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.25s ease;
      font-weight: 500;
      color: #d4f5e8;
    }
    .nav-item i { width: 28px; font-size: 1.2rem; }
    .nav-item.active { background: linear-gradient(135deg, #2a9d6e, #1b7a52); color: white; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2); transform: translateX(5px); }
    .nav-item:hover:not(.active) { background: rgba(42, 157, 110, 0.4); transform: translateX(5px); }
    .main-panel { flex: 1; overflow-y: auto; padding: 24px 32px; }
    .card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 32px;
      padding: 28px;
      margin-bottom: 28px;
      box-shadow: 0 20px 40px rgba(0, 32, 0, 0.1);
      border: 1px solid rgba(100, 180, 120, 0.3);
      transition: transform 0.2s ease;
    }
    .card:hover { transform: translateY(-2px); }
    .btn {
      border: none;
      padding: 10px 24px;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    .btn-primary { background: linear-gradient(135deg, #2e7d32, #1b5e20); color: white; }
    .btn-primary:hover { transform: scale(0.98); }
    .btn-outline { background: transparent; border: 2px solid #2e7d32; color: #1b5e20; }
    .btn-outline:hover { background: #2e7d32; color: white; }
    .btn-sm { padding: 6px 14px; font-size: 0.8rem; }
    input, select, textarea {
      width: 100%;
      padding: 12px 18px;
      border-radius: 28px;
      border: 1.5px solid #cfe3cf;
      background: white;
      margin-top: 6px;
      margin-bottom: 16px;
      font-size: 0.9rem;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #2e7d32; box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.2); }
    label { font-weight: 600; color: #1c4d2d; margin-top: 8px; margin-bottom: 4px; display: block; }
    .flex-row { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
    .soal-editor {
      background: #fffbe6;
      border-radius: 24px;
      padding: 20px;
      border-left: 6px solid #2e7d32;
      font-family: monospace;
      white-space: pre-wrap;
      min-height: 300px;
      max-height: 500px;
      overflow: auto;
      font-size: 13px;
      line-height: 1.6;
    }
    .mapel-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #e8f5e9;
      padding: 6px 14px;
      border-radius: 40px;
      margin: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mapel-tag.active { background: linear-gradient(135deg, #2e7d32, #1b5e20); color: white; }
    .mapel-tag i { cursor: pointer; color: #d32f2f; }
    .api-status { padding: 12px 16px; border-radius: 20px; margin-top: 12px; font-size: 0.85rem; }
    .api-status.valid { background: #e8f5e9; color: #2e7d32; border-left: 4px solid #2e7d32; }
    .api-status.invalid { background: #ffebee; color: #c62828; border-left: 4px solid #c62828; }
    @media (max-width: 800px) {
      .sidebar { width: 80px; padding: 20px 12px; }
      .sidebar .logo span, .nav-item span { display: none; }
      .main-panel { padding: 16px; }
    }
  </style>
</head>
<body>

<div class="sidebar">
  <div class="logo"><i class="fas fa-brain"></i><span>ExamForge</span></div>
  <div class="nav-item active" data-menu="ai-generate"><i class="fas fa-microchip"></i><span>AI Generate</span></div>
  <div class="nav-item" data-menu="manual"><i class="fas fa-pen-alt"></i><span>Buat Manual</span></div>
  <div class="nav-item" data-menu="bank"><i class="fas fa-database"></i><span>Bank Soal</span></div>
  <div class="nav-item" data-menu="maker"><i class="fas fa-sliders-h"></i><span>Test Maker</span></div>
  <div class="nav-item" data-menu="cbt"><i class="fas fa-laptop-code"></i><span>Zona CBT</span></div>
  <div class="nav-item" data-menu="settings"><i class="fas fa-cog"></i><span>Settings</span></div>
</div>

<div class="main-panel" id="mainPanel"></div>

<script>
  // ========== STATE ==========
  let bankSoal = JSON.parse(localStorage.getItem('bankSoalFull') || `{
    "Matematika": [],
    "IPA": [],
    "Bahasa Inggris": []
  }`);
  let currentMapel = "Matematika";
  let examSettings = JSON.parse(localStorage.getItem('examSettingsCplx') || '{}');
  let apiKeys = JSON.parse(localStorage.getItem("apiKeys") || `{ "gemini": "" }`);
  
  function saveBank() { localStorage.setItem('bankSoalFull', JSON.stringify(bankSoal)); }
  function saveSettings() { localStorage.setItem('examSettingsCplx', JSON.stringify(examSettings)); localStorage.setItem("apiKeys", JSON.stringify(apiKeys)); }
  function isAPIValid() { return apiKeys.gemini && apiKeys.gemini.trim().startsWith("AIza"); }
  
  // ========== AI CALL ==========
  async function callGemini(prompt) {
    if (!isAPIValid()) {
      await Swal.fire({ title: 'API Key Belum Diset', text: 'Masukkan Gemini API Key di menu Settings', icon: 'warning', confirmButtonText: 'Buka Settings' }).then(r => { if(r.isConfirmed) document.querySelector('.nav-item[data-menu="settings"]').click(); });
      return null;
    }
    
    const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKeys.gemini}`;
    
    try {
      const response = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }],
          generationConfig: { temperature: 0.7, maxOutputTokens: 2048 }
        })
      });
      
      const data = await response.json();
      if (data.error) throw new Error(data.error.message);
      return data.candidates[0].content.parts[0].text;
    } catch (err) {
      Swal.fire('Error', err.message, 'error');
      return null;
    }
  }
  
  // ========== GENERATE SOAL DALAM BENTUK TEKS (BUKAN JSON) ==========
  async function generateSoalTeks() {
    const prompt = document.getElementById('aiPrompt')?.value;
    const tipe = document.getElementById('aiTipe')?.value;
    const mapel = currentMapel;
    
    if (!prompt) { Swal.fire('Isi prompt materi dulu bro'); return; }
    
    Swal.fire({ title: 'AI Sedang Membuat Soal...', didOpen: () => Swal.showLoading() });
    
    const instruction = `Buatkan ${tipe === 'NARASI' ? '1 narasi panjang dengan 3 sub soal' : '2-3 soal'} dengan format TEKS biasa (BUKAN JSON, BUKAN KODE) seperti contoh di bawah:

CONTOH FORMAT UNTUK ${tipe === 'PG' ? 'PG' : tipe === 'NARASI' ? 'NARASI' : tipe === 'BS' ? 'BENAR SALAH' : 'SETUJU/TIDAK SETUJU'}:

${tipe === 'PG' ? `=== SOAL 1 ===
Tipe: PG
Teks: Apa ibu kota Indonesia?
A. Jakarta
B. Surabaya
C. Bandung
D. Medan
Jawaban: A

=== SOAL 2 ===
Tipe: PG
Teks: Siapa presiden pertama Indonesia?
A. Soeharto
B. Soekarno
C. Habibie
D. Gus Dur
Jawaban: B` : tipe === 'NARASI' ? `=== NARASI ===
Teks: Indonesia adalah negara kepulauan terbesar di dunia. Memiliki lebih dari 17.000 pulau. Ibu kota negara adalah Jakarta.

=== SOAL 1 (NARASI) ===
Pertanyaan: Berapa jumlah pulau di Indonesia?
A. 10.000
B. 15.000
C. 17.000
D. 20.000
Jawaban: C

=== SOAL 2 (NARASI) ===
Pertanyaan: Apa ibu kota Indonesia?
A. Surabaya
B. Bandung
C. Jakarta
D. Medan
Jawaban: C` : tipe === 'BS' ? `=== SOAL ===
Tipe: BS
Narasi: Teks tentang materi...
Pernyataan 1: Indonesia merdeka tahun 1945
Pernyataan 2: Ibu kota Indonesia adalah Surabaya
Pernyataan 3: Presiden pertama adalah Soekarno
Pernyataan 4: Bahasa nasional adalah Bahasa Jawa
Pernyataan 5: Bendera Indonesia merah putih
Kunci Jawaban: B,S,B,S,B (B=Benar, S=Salah)` : tipe === 'STTS' ? `=== SOAL ===
Tipe: STTS
Narasi: Teks tentang materi...
Pernyataan 1: Menurut saya, mata pelajaran ini penting
Pernyataan 2: Saya setuju dengan konsep yang dijelaskan
Pernyataan 3: Materi ini mudah dipahami
Pernyataan 4: Saya merekomendasikan materi ini ke teman
Pernyataan 5: Pembelajaran ini bermanfaat untuk masa depan` : `=== SOAL ===
Tipe: PG
Teks: Contoh soal...
A. Opsi A
B. Opsi B
C. Opsi C
D. Opsi D
Jawaban: A`}

Buat soal dengan materi: ${prompt}
Tingkat kesulitan: Sedang - HOTS
Jangan tambahkan teks penjelasan apapun di luar format soal. Langsung soal saja.`;

    const result = await callGemini(instruction);
    Swal.close();
    
    if (result) {
      const editor = document.getElementById('soalEditor');
      if (editor) editor.innerText = result;
    }
  }
  
  // ========== SIMPAN KE BANK SOAL (SEBAGAI TEKS) ==========
  function simpanKeBank() {
    const teksSoal = document.getElementById('soalEditor')?.innerText;
    if (!teksSoal || teksSoal.trim() === '') {
      Swal.fire('Tidak ada soal', 'Generate dulu atau tulis manual', 'warning');
      return;
    }
    
    bankSoal[currentMapel].push({
      tipe: 'TEKS',
      raw: teksSoal,
      createdAt: new Date().toISOString()
    });
    saveBank();
    Swal.fire('Berhasil!', `Soal tersimpan ke ${currentMapel}`, 'success');
  }
  
  // ========== TAMBAH MAPEL ==========
  async function tambahMapel() {
    const { value } = await Swal.fire({ title: 'Nama Mapel Baru', input: 'text', inputPlaceholder: 'Contoh: Fisika, Kimia, Sejarah' });
    if (value && !bankSoal[value.trim()]) {
      bankSoal[value.trim()] = [];
      saveBank();
      currentMapel = value.trim();
      Swal.fire('Berhasil!', `Mapel ${value} ditambahkan`, 'success');
      render();
    } else if (bankSoal[value]) Swal.fire('Gagal', 'Mapel sudah ada', 'error');
  }
  
  function hapusMapel(mapel) {
    if (mapel === currentMapel) { Swal.fire('Tidak bisa', 'Pilih mapel lain dulu', 'warning'); return; }
    Swal.fire({ title: `Hapus ${mapel}?`, text: 'Semua soal akan hilang', icon: 'warning', showCancelButton: true }).then(r => {
      if (r.isConfirmed) { delete bankSoal[mapel]; saveBank(); render(); }
    });
  }
  
  function renderMapelTags() {
    const container = document.getElementById('mapelTags');
    if (!container) return;
    let html = '';
    Object.keys(bankSoal).forEach(m => {
      html += `<div class="mapel-tag ${currentMapel === m ? 'active' : ''}" data-mapel="${m}">${m}<i class="fas fa-times-circle" onclick="event.stopPropagation(); hapusMapel('${m}')"></i></div>`;
    });
    html += `<button class="btn-outline btn-sm" id="btnTambahMapel"><i class="fas fa-plus"></i> Mapel</button>`;
    container.innerHTML = html;
    document.querySelectorAll('.mapel-tag').forEach(tag => {
      tag.addEventListener('click', (e) => { if (e.target.tagName !== 'I') { currentMapel = tag.dataset.mapel; render(); } });
    });
    document.getElementById('btnTambahMapel')?.addEventListener('click', tambahMapel);
  }
  
  // ========== RENDER ==========
  function render() {
    const menu = document.querySelector('.nav-item.active')?.dataset.menu || 'ai-generate';
    const panel = document.getElementById('mainPanel');
    
    if (menu === 'ai-generate') {
      panel.innerHTML = `
        <div class="card">
          <h2><i class="fas fa-microchip"></i> AI Generate Soal</h2>
          ${!isAPIValid() ? '<div class="api-status invalid"><i class="fas fa-exclamation-circle"></i> API Key belum diisi. <a href="#" onclick="document.querySelector(\'.nav-item[data-menu=\\\'settings\\\']\').click()">Klik Settings</a></div>' : '<div class="api-status valid"><i class="fas fa-check-circle"></i> API Key siap digunakan</div>'}
          <div class="flex-row" style="justify-content: space-between; align-items: center; margin: 16px 0;">
            <div id="mapelTags" style="flex:1"></div>
          </div>
          <label><i class="fas fa-list"></i> Tipe Soal</label>
          <select id="aiTipe">
            <option value="PG">Pilihan Ganda (PG)</option>
            <option value="NARASI">Narasi (1 narasi + 3 soal)</option>
            <option value="BS">Benar/Salah (5 pernyataan)</option>
            <option value="STTS">Setuju/Tidak Setuju (INK)</option>
          </select>
          <label><i class="fas fa-book"></i> Materi / Prompt</label>
          <textarea id="aiPrompt" rows="4" placeholder="Contoh: Buat soal tentang sistem pernapasan manusia untuk kelas 8, tingkat HOTS"></textarea>
          <button id="btnGenerate" class="btn-primary"><i class="fas fa-magic"></i> Generate Soal</button>
          
          <label style="margin-top: 24px;"><i class="fas fa-edit"></i> Hasil Soal (Edit Bebas)</label>
          <div id="soalEditor" class="soal-editor" contenteditable="true" placeholder="Hasil generate akan muncul di sini, bisa diedit langsung..."></div>
          
          <div class="flex-row" style="margin-top: 16px;">
            <button id="btnSimpanBank" class="btn-primary"><i class="fas fa-save"></i> Simpan ke Bank Soal</button>
            <button id="btnClear" class="btn-outline"><i class="fas fa-trash"></i> Bersihkan</button>
          </div>
        </div>
        <div class="card">
          <h3><i class="fas fa-info-circle"></i> Format Soal yang Bisa Diedit Manual</h3>
          <pre style="background:#f0f0f0;padding:12px;border-radius:16px;font-size:12px;overflow:auto">
=== SOAL 1 ===
Tipe: PG
Teks: Apa ibu kota Indonesia?
A. Jakarta
B. Surabaya
C. Bandung
D. Medan
Jawaban: A

=== SOAL 2 ===
Tipe: PG
Teks: Siapa presiden pertama?
A. Soeharto
B. Soekarno
C. Habibie
D. Gus Dur
Jawaban: B</pre>
        </div>
      `;
      renderMapelTags();
      document.getElementById('btnGenerate')?.addEventListener('click', generateSoalTeks);
      document.getElementById('btnSimpanBank')?.addEventListener('click', simpanKeBank);
      document.getElementById('btnClear')?.addEventListener('click', () => { document.getElementById('soalEditor').innerText = ''; });
    }
    else if (menu === 'manual') {
      panel.innerHTML = `
        <div class="card">
          <h2><i class="fas fa-pen-alt"></i> Buat Soal Manual</h2>
          <div id="mapelTags"></div>
          <label>Teks Soal</label>
          <textarea id="manualSoal" rows="10" class="soal-editor" style="font-family:monospace" placeholder="Tulis soal dengan format:
=== SOAL 1 ===
Tipe: PG
Teks: Pertanyaan?
A. Opsi A
B. Opsi B
C. Opsi C
D. Opsi D
Jawaban: A"></textarea>
          <button id="simpanManualBtn" class="btn-primary"><i class="fas fa-save"></i> Simpan ke Bank Soal</button>
        </div>
      `;
      renderMapelTags();
      document.getElementById('simpanManualBtn')?.addEventListener('click', () => {
        const teks = document.getElementById('manualSoal').value;
        if (teks.trim()) {
          bankSoal[currentMapel].push({ tipe: 'MANUAL', raw: teks, createdAt: new Date().toISOString() });
          saveBank();
          Swal.fire('Tersimpan!', `Soal ditambahkan ke ${currentMapel}`, 'success');
          document.getElementById('manualSoal').value = '';
        } else Swal.fire('Kosong', 'Tulis soal dulu', 'warning');
      });
    }
    else if (menu === 'bank') {
      panel.innerHTML = `
        <div class="card">
          <h2><i class="fas fa-database"></i> Bank Soal - ${currentMapel}</h2>
          <div id="mapelTags"></div>
          <div id="bankList">
            ${bankSoal[currentMapel]?.length === 0 ? '<i>Tidak ada soal. Generate atau buat manual dulu.</i>' : 
              bankSoal[currentMapel].map((s, i) => `<div class="soal-editor" style="margin-bottom:16px; position:relative"><button class="btn-outline btn-sm" style="position:absolute; top:8px; right:8px" onclick="hapusSoal(${i})"><i class="fas fa-trash"></i></button><pre style="white-space:pre-wrap">${s.raw || JSON.stringify(s, null, 2)}</pre></div>`).join('')}
          </div>
        </div>
      `;
      renderMapelTags();
      window.hapusSoal = (idx) => {
        Swal.fire({ title: 'Hapus soal?', icon: 'warning', showCancelButton: true }).then(r => {
          if (r.isConfirmed) { bankSoal[currentMapel].splice(idx, 1); saveBank(); render(); }
        });
      };
    }
    else if (menu === 'maker') {
      panel.innerHTML = `
        <div class="card">
          <h2><i class="fas fa-sliders-h"></i> Test Maker</h2>
          <div id="mapelTags"></div>
          <label>Durasi (menit)</label><input id="durasi" type="number" value="${examSettings.durasi || 60}">
          <label>Token Ujian</label><input id="token" value="${examSettings.token || 'EXAM2025'}">
          <button id="saveMaker" class="btn-primary">Simpan Pengaturan</button>
          <div style="margin-top:16px;padding:12px;background:#e8f5e9;border-radius:20px"><i class="fas fa-info-circle"></i> Soal dari mapel <strong>${currentMapel}</strong> (${bankSoal[currentMapel]?.length || 0} soal)</div>
        </div>
      `;
      renderMapelTags();
      document.getElementById('saveMaker')?.addEventListener('click', () => {
        examSettings.durasi = document.getElementById('durasi').value;
        examSettings.token = document.getElementById('token').value;
        examSettings.mapelUjian = currentMapel;
        examSettings.soalUjian = bankSoal[currentMapel] || [];
        saveSettings();
        Swal.fire('Tersimpan', `Mapel: ${currentMapel}`, 'success');
      });
    }
    else if (menu === 'cbt') {
      panel.innerHTML = `
        <div class="card">
          <h2><i class="fas fa-laptop-code"></i> CBT Mode</h2>
          <label>Nama</label><input id="cbtNama"><label>Kelas</label><input id="cbtKelas"><label>Token</label><input id="cbtToken"><button id="cbtLogin" class="btn-primary">Mulai Ujian</button>
        </div>
      `;
      document.getElementById('cbtLogin')?.addEventListener('click', () => {
        const token = document.getElementById('cbtToken').value;
        if (token !== examSettings.token) { Swal.fire('Token salah!'); return; }
        if (!bankSoal[currentMapel]?.length) { Swal.fire('Belum ada soal'); return; }
        Swal.fire('Mode Demo CBT', `Soal dari ${currentMapel} (${bankSoal[currentMapel].length} soal) siap diuji`, 'info');
      });
    }
    else if (menu === 'settings') {
      panel.innerHTML = `
        <div class="card">
          <h2><i class="fas fa-cog"></i> Settings</h2>
          <label><i class="fab fa-google"></i> Gemini API Key</label>
          <input id="geminiKey" value="${apiKeys.gemini}" placeholder="AIzaSy...">
          <button id="testApiBtn" class="btn-outline" style="margin-bottom:16px"><i class="fas fa-vial"></i> Test API Key</button>
          <button id="saveApiBtn" class="btn-primary">Simpan API Key</button>
          <div style="margin-top:20px;padding:12px;background:#e8f5e9;border-radius:20px;font-size:13px">
            <i class="fas fa-question-circle"></i> <strong>Cara dapatkan API Key:</strong><br>
            1. Buka <a href="https://aistudio.google.com" target="_blank">AI Studio Google</a><br>
            2. Login dengan akun Google<br>
            3. Klik "Get API Key" → "Create API Key"<br>
            4. Copy dan paste di atas
          </div>
        </div>
      `;
      document.getElementById('saveApiBtn')?.addEventListener('click', () => {
        apiKeys.gemini = document.getElementById('geminiKey').value;
        saveSettings();
        Swal.fire('Tersimpan!', 'API Key disimpan', 'success');
        render();
      });
      document.getElementById('testApiBtn')?.addEventListener('click', async () => {
        const key = document.getElementById('geminiKey').value;
        if (!key) { Swal.fire('Masukkan API Key dulu'); return; }
        Swal.fire({ title: 'Testing...', didOpen: () => Swal.showLoading() });
        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
          const data = await res.json();
          Swal.close();
          if (data.error) Swal.fire('Gagal', data.error.message, 'error');
          else Swal.fire('Sukses!', 'API Key valid', 'success');
        } catch(e) { Swal.close(); Swal.fire('Error', e.message, 'error'); }
      });
    }
  }
  
  // ========== NAVIGASI ==========
  document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => {
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      item.classList.add('active');
      render();
    });
  });
  
  render();
</script>
</body>
</html>
